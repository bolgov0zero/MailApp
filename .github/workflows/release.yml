name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Install dependencies
        run: npm ci

      - name: Fetch WinSW (update-service wrapper)
        shell: pwsh
        run: |
          $url = 'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile "service\MailAppService.exe"
          if (-not (Test-Path "service\MailAppService.exe")) { throw "WinSW download failed" }

      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:publish

      - name: Package management server (MailAppServer.zip)
        shell: pwsh
        run: |
          $stage = "server-pkg"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "server\*" -Destination $stage -Recurse -Force
          # Never ship live data or local config — only the code + example config.
          Remove-Item -Path "$stage\config.php"  -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$stage\mailapp.db*" -Force -ErrorAction SilentlyContinue
          if (Test-Path MailAppServer.zip) { Remove-Item MailAppServer.zip -Force }
          Compress-Archive -Path "$stage\*" -DestinationPath MailAppServer.zip -Force

      - name: Upload server zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" MailAppServer.zip --clobber

      - name: Publish release as Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release edit "$TAG" --draft=false --latest --title "MailApp $TAG"
